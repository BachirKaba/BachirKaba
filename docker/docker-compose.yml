version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moto_taxi
    ports: ['5432:5432']
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ['6379:6379']
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/moto_taxi?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret
      PORT: 3000
    ports: ['3000:3000']
    depends_on: [db, redis]
volumes:
  pg_data:
